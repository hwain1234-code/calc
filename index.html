<html lang="ko">
<head>

<link rel="manifest" href='data:application/json,{"name":"PSAT 암산연습","short_name":"암산연습","start_url":".","display":"standalone","background_color":"%23111111","theme_color":"%23111111","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 rx=%2236%22 fill=%22%23111%22/%3E%3Crect y=%2228%22 x=%2216%22 width=%22160%22 height=%2244%22 rx=%228%22 fill=%22%23FFD400%22/%3E%3Ctext x=%2296%22 y=%22150%22 font-size=%2280%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22%23fff%22 text-anchor=%22middle%22%3E123%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml","purpose":"any maskable"}]}'>
<style>
  :root{
    --bg:#0f1014; --card:#1a1b21; --card2:#25262e; --line:#363742;
    --yellow:#FFD400; --txt:#fff; --sub:#9a9aa6; --green:#34c759; --red:#ff453a; --blue:#60a5fa;
    --purple:#a78bfa; --mint:#5eead4; --orange:#fb923c; --pink:#f472b6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-user-select:none; user-select:none; overflow-x:hidden;
  }
  #app{max-width:520px; margin:0 auto; min-height:100%; padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:18px 0 2px}
  h1 .hl{background:var(--yellow);color:#111;padding:0 8px;border-radius:6px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05)}
  .ic{display:inline-flex;width:34px;height:34px;border-radius:10px;align-items:center;justify-content:center;font-size:18px;margin-right:10px;vertical-align:middle}
  .ic.y{background:rgba(255,212,0,.16)} .ic.b{background:rgba(96,165,250,.18)} .ic.g{background:rgba(52,199,89,.18)} .ic.p{background:rgba(167,139,250,.2)} .ic.m{background:rgba(94,234,212,.18)}
  .gcard{border-left:4px solid var(--purple)}
  .gbar{height:4px;background:var(--card2);border-radius:2px;margin-top:10px;overflow:hidden}
  .gbar>div{height:100%}
  .row{display:flex;gap:10px;margin-bottom:12px}
  .row>*{flex:1}
  .row .btn{margin-bottom:0}
  .btn{
    background:var(--card2);color:var(--txt);border:1px solid rgba(255,255,255,.05);border-radius:14px;
    padding:16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
    width:100%;transition:transform .05s; text-align:left; margin-bottom:12px;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--yellow);color:#111;border-color:transparent}
  .btn.primary .ic{background:rgba(0,0,0,.12)}
  .btn.big{padding:22px 18px;font-size:18px}
  .btn .t{font-size:17px;font-weight:700}
  .btn .d{font-size:12px;color:var(--sub);margin-top:3px;font-weight:500}
  .btn.primary .d{color:#5a5300}
  .btn.center{text-align:center}
  .sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid rgba(255,255,255,.05)}
  .stat.y .n{color:var(--yellow)} .stat.b .n{color:var(--blue)} .stat.p .n{color:var(--purple)} .stat.m .n{color:var(--mint)}
  .stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}

  .pbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:26px}

  .mul{font-variant-numeric:tabular-nums;letter-spacing:1px}
  /* 소수점 강조: 크고 노란 점 + 앞뒤 여백 */

  @keyframes fno{0%,100%{background:var(--card)}40%{background:rgba(255,69,58,.28)}}
  /* result */

  .gS{color:#ffd400}.gA{color:#34c759}.gB{color:#0a84ff}.gC{color:#ff9f0a}.gD{color:#ff453a}
  .pb-tag{display:inline-block;background:var(--yellow);color:#111;font-weight:800;font-size:13px;padding:5px 12px;border-radius:20px}

  .adv .gap{margin-bottom:6px}
  .adv .m{margin:4px 0;padding-left:8px;border-left:2px solid var(--line)}
  .adv .m.best{color:var(--txt);border-left-color:var(--yellow)}

  .adv .m.best b{color:var(--yellow)}
  .adv .ez{font-size:12px}
  .adv .tag{display:inline-block;background:var(--yellow);color:#111;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
  .bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar .lb{width:84px;font-weight:700;flex:none}
  .bar .tr{flex:1;background:var(--card2);border-radius:6px;height:16px;overflow:hidden}
  .bar .tr>div{height:100%;background:var(--red)}
  .bar .nn{width:76px;text-align:right;color:var(--sub);flex:none}
  svg.chart{width:100%;height:120px;display:block}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--yellow);color:#111;font-weight:700;padding:12px 20px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}

  .seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;background:none;border:none;color:var(--sub);font-weight:700;padding:9px;border-radius:9px;font-family:inherit;font-size:14px;cursor:pointer}
  .seg button.on{background:var(--yellow);color:#111}
  .hint{color:var(--sub);font-size:12px;line-height:1.5;margin-top:6px}
  /* ===== 개념 학습 ===== */
  .ccard{display:flex;align-items:center;gap:10px;padding:14px;border-left:4px solid var(--purple);margin-bottom:10px}
  .ccard .num{flex:none;width:22px;font-weight:800;font-size:15px;text-align:center}
  .ccard .body{flex:1;min-width:0}
  .ccard .done{flex:none;background:var(--card2);color:var(--sub);border:none;border-radius:20px;padding:8px 12px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer}

  .ccard.isdone .t{color:var(--sub);text-decoration:line-through}
  .exp{font-size:14px;line-height:1.7;-webkit-user-select:text;user-select:text}
  .exp p{margin:8px 0}
  .exp ol,.exp ul{margin:6px 0 6px 20px}
  .exp li{margin:4px 0}
  .exp b{color:var(--yellow)}
  .exp .frac{font-size:13px;vertical-align:middle;margin:0 2px}
  .exp .frac .d{border-top-width:2px}
  .exb{background:rgba(255,212,0,.06);border-left:3px solid var(--yellow);border-radius:0 12px 12px 0;padding:10px 12px;margin:12px 0;font-size:13.5px;line-height:1.7}
  .exh{font-weight:800;color:var(--yellow);margin-bottom:4px;font-size:13px}
  .exp u{text-decoration:none;border-bottom:2px solid var(--mint);color:var(--mint)}
  .sub2{color:var(--sub);font-size:12.5px}
  .ctab{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px;font-variant-numeric:tabular-nums}
  .ctab th,.ctab td{border:1px solid var(--line);padding:6px 4px;text-align:center}
  .ctab th{background:rgba(167,139,250,.14);font-weight:700}
  .ctab th.rl{text-align:left;font-weight:600;white-space:nowrap}
  .ctab .frac{font-size:12px}
  .ctab input{width:100%;min-width:52px;background:#0d0d0f;color:var(--yellow);border:1px solid var(--line);border-radius:6px;padding:6px 2px;font-size:14px;font-weight:700;text-align:center;font-family:inherit;font-variant-numeric:tabular-nums}
  .ctab input:focus{outline:2px solid var(--yellow)}
  .ctab input.ok{border-color:var(--green);color:var(--green)}
  .ctab input.no{border-color:var(--red);color:var(--red)}
  .exwrap{overflow-x:auto}
  .qitem{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.6}
  .qitem .frac{font-size:12px}
  .qitem .qrow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .qitem input{flex:1;background:#0d0d0f;color:var(--yellow);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;font-weight:700;font-family:inherit;min-width:0}
  .qitem input.ok{border-color:var(--green);color:var(--green)}
  .qitem input.no{border-color:var(--red);color:var(--red)}
  .oxb{display:flex;gap:8px;margin-top:8px}
  .oxb button{flex:1;background:#0d0d0f;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer}
  .oxb button.sel{background:var(--yellow);color:#111;border-color:var(--yellow)}
  .oxb button.ok{background:var(--green);color:#fff;border-color:var(--green)}
  .oxb button.no{background:var(--red);color:#fff;border-color:var(--red)}
  .sol{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub);line-height:1.6}
  .sol b{color:var(--txt)}
  .sol .frac{font-size:12px}
  .sol.ok{color:var(--green)}
  .sol .cr{color:var(--green);font-weight:700}
  .sol .wr{color:var(--red);font-weight:700}
  .exsc{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0;font-weight:700}
  /* ===== 집중 연습 ===== */
  .ccard.off{opacity:.55}
  .ccard .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#111}
  .ccard .chk.on{background:var(--green);border-color:var(--green);color:#fff}
  #pq .qrow{display:flex;gap:8px;align-items:center;margin-top:14px}
  #pq input{flex:1;background:#0d0d0f;color:var(--yellow);border:2px solid var(--line);border-radius:12px;padding:14px 12px;font-size:22px;font-weight:800;font-family:inherit;min-width:0;font-variant-numeric:tabular-nums}
  #pq input:focus{outline:none;border-color:var(--yellow)}
  .punit{flex:none;color:var(--sub);font-weight:700;font-size:15px;min-width:36px}
  .oxb.big{margin-top:14px}
  .oxb.big button{padding:18px;font-size:26px}
  .pch{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .pch button{background:#0d0d0f;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;text-align:left}
  .pch button.sel{background:var(--yellow);color:#111;border-color:var(--yellow)}
  .pch button.ok{background:var(--green);color:#fff;border-color:var(--green)}
  .pch button.no{background:var(--red);color:#fff;border-color:var(--red)}
  .pch button:disabled,.oxb button:disabled{cursor:default}
  .pad{width:100%;display:block;background:#15161b;border:1px dashed var(--line);border-radius:12px;margin-top:8px;touch-action:none}
  #pq .ctab{font-size:14px}
  #pq .ctab th,#pq .ctab td{padding:7px 6px}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="concepts.js"></script>
<script src="practice.js"></script>
<script>
/* ================= 데이터: 문제 유형 정의 ================= */
// sec: [S,A,B,C] — 문제 1개당 목표시간(초). D는 C 초과. (교재 등급표 비례환산)
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];

// 분수비교: 두 분수를 가깝게 생성 → 실전형 대소판단
function fFracCmp(){
  let a=R(10,300), b=R(20,400);
  const val=a/b; const factor=1+R(-25,25)/100;
  let d=R(20,400); let c=Math.round(val*factor*d);
  if(c<1)c=1;
  if(a*d===c*b)c+=1; // 동일 방지
  const ans = (a*d>c*b)?'>':'<';
  return {mode:'cmp', left:{n:a,d:b}, right:{n:c,d:d}, kind:'frac', answer:ans};
}
// 곱셈비교: a×b vs c×d (소수 섞임)
function fMulCmp(){
  const dec=Math.random()<.5;
  let a=R(1000,9999), b= dec? R(200,999)/10 : R(20,99);
  const val=a*b; const factor=1+R(-18,18)/100;
  let c=R(1000,9999); let d=Math.round(val*factor/c);
  if(dec) d=Math.round(val*factor/c*10)/10;
  if(d<10)d=R(20,99); if(d>99&&!dec)d=R(20,99);
  const lp=a*b, rp=c*d;
  if(lp===rp)return fMulCmp();
  const ans=(lp>rp)?'>':'<';
  return {mode:'cmp', left:{a,b}, right:{c,d}, kind:'mul', answer:ans};
}

const TYPES=[
  {id:'fraccmp',name:'분수 비교',ex:'33/46  □  41/46',gen:fFracCmp,sec:[7,10,12,15],def:12},
  {id:'mulcmp',name:'곱셈 비교',ex:'7300×30.8 □ 8600×25.4',gen:fMulCmp,sec:[10,13,16,20],def:10},
];
const TYPE=id=>TYPES.find(t=>t.id===id);
// 소수점을 눈에 띄게: 30.8 → 30<span class="dot">.</span>8
const dec=x=>String(x).replace('.','<span class="dot">.</span>');

/* ================= 저장소 ================= */
const KEY='psatcalc_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function db(){const d=load();d.records=d.records||{};d.streak=d.streak||{last:null,days:0};d.totalSolved=d.totalSolved||0;d.frac=d.frac||{bucket:{},method:{},wrong:[]};return d;}
function today(){const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();}
function yesterday(){const t=new Date();t.setDate(t.getDate()-1);return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();}

function saveSession(typeId,rec){
  const d=db();
  (d.records[typeId]=d.records[typeId]||[]).push(rec);
  if(d.records[typeId].length>60)d.records[typeId]=d.records[typeId].slice(-60);
  // streak
  const td=today();
  if(d.streak.last!==td){ d.streak.days = (d.streak.last===yesterday())? d.streak.days+1 : 1; d.streak.last=td; }
  d.totalSolved += rec.total;
  save(d);
}
function bestPerProblem(typeId){
  const d=db(); const h=d.records[typeId]; if(!h||!h.length)return null;
  const perfect=h.filter(r=>r.correct===r.total&&!r.partial).map(r=>r.sec/r.total); // 전부 정답·완주 세션만
  if(!perfect.length)return null;
  return Math.min(...perfect);
}

/* ================= 등급 ================= */
function gradeOf(problems, elapsed){
  const th=[0,0,0,0];
  problems.forEach(p=>{const s=p._sec; for(let i=0;i<4;i++)th[i]+=s[i];});
  if(elapsed<=th[0])return'S'; if(elapsed<=th[1])return'A';
  if(elapsed<=th[2])return'B'; if(elapsed<=th[3])return'C'; return'D';
}
function thresholds(problems){const th=[0,0,0,0];problems.forEach(p=>{for(let i=0;i<4;i++)th[i]+=p._sec[i]});return th;}

/* ================= 상태 ================= */
let S={};

/* ================= 화면 ================= */
const app=()=>document.getElementById('app');
function go(fn){window.scrollTo(0,0);fn();}

function screenHome(){
  const d=db();
  const solvedToday=(()=>{let n=0;Object.values(d.records).forEach(h=>h.forEach(r=>{if(r.date===today())n+=r.total}));return n;})();
  app().innerHTML=`
    <h1><span class="hl">암산</span> 연습</h1>
    <div class="sub">PSAT 자료해석 · 오프라인 속도훈련</div>
    <div class="grid3">
      <div class="stat y"><div class="n">${d.streak.days||0}<span style="font-size:14px">일</span></div><div class="l">🔥 연속</div></div>
      <div class="stat b"><div class="n">${solvedToday}</div><div class="l">오늘 푼 문제</div></div>
      <div class="stat p"><div class="n">${d.totalSolved||0}</div><div class="l">누적 문제</div></div>
    </div>
    <div class="sec-title">암산 훈련</div>
    <button class="btn primary big" id="m1"><div class="t"><span class="ic">🎯</span>스킬 드릴</div><div class="d">분수 비교 · 곱셈 비교 한 유형씩 집중 반복</div></button>
    <button class="btn big" id="m2"><div class="t"><span class="ic b">🔀</span>복합 훈련</div><div class="d">분수·곱셈 비교를 섞은 실전 세트</div></button>
    <button class="btn big" id="m3"><div class="t"><span class="ic g">📈</span>기록실</div><div class="d">유형별 최고기록·성장그래프</div></button>

function pdb(){const d=db();d.practice=d.practice||{topics:{},wrong:[]};return d;}
function screenPractice(){

      <div class="hint">숫자 입력 · O/X · 고르기 형식이 섞여 나오고, 3문제 중 1문제쯤은 어림이 필요한 실전형 숫자로 나와요 (±2% 허용). 틀린 문제는 세트 끝에 한 번 더 나옵니다.</div>
    </div>
    <button class="btn primary big center" id="start">시작 ▶</button>

  document.getElementById('bk').onclick=()=>go(screenHome);
  app().querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t;const i=S.pr.sel.indexOf(k);if(i>=0)S.pr.sel.splice(i,1);else S.pr.sel.push(k);screenPractice();});

    startPractice(cshuffle(qs),{retry:false});
  };

function startPractice(qs,meta){
  S.ps={qs,meta,i:0,res:[],start:Date.now(),timer:null,requeue:[]};
  renderPractice();
  S.ps.timer=setInterval(()=>{const e=document.getElementById('ptimer');if(e)e.textContent=fmt(Date.now()-S.ps.start);},500);
}
function renderPractice(){
  const s=S.ps, q=s.qs[s.i], t=PRACTICE[q.topic], total=s.qs.length;
  let input;

  app().querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>{app().querySelectorAll('[data-ox]').forEach(x=>x.classList.toggle('sel',x===b));submit(b.dataset.ox==='1');});
  app().querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{app().querySelectorAll('[data-ch]').forEach(x=>x.classList.toggle('sel',x===b));submit(+b.dataset.ch);});
  document.getElementById('psub').onclick=()=>{if(q.kind==='num')submit(pin.value);else{const sel=app().querySelector('.sel');if(!sel){toast('답을 고르세요');return;}submit(sel.dataset.ox!==undefined?sel.dataset.ox==='1':+sel.dataset.ch);}};
  document.getElementById('pskip').onclick=()=>submit(null);
  document.onkeydown=null;

function answerPractice(val){
  const s=S.ps; if(s._done)return; s._done=true;
  const q=s.qs[s.i];
  let ok=false, shown='';
  if(q.kind==='num'){const x=parseFloat(String(val??'').replace(/,/g,''));ok=!isNaN(x)&&Math.abs(x-q.ans)<=Math.max(0.011,Math.abs(q.ans)*(q.tol||0.006));shown=val===null||val===''?'미입력':val;}
  else if(q.kind==='ox'){ok=val===q.ans;shown=val===null?'미선택':(val?'O':'X');}
  else {ok=val===q.ans;shown=val===null?'미선택':q.choices[val];}
  s.res.push({q,ok,your:shown});
  // 통계
  const d=pdb();const st=d.practice.topics[q.topic]=d.practice.topics[q.topic]||{n:0,w:0};st.n++;if(!ok)st.w++;
  if(!ok){d.practice.wrong.push({ts:Date.now(),q});if(d.practice.wrong.length>50)d.practice.wrong=d.practice.wrong.slice(-50);}
  else if(s.meta.retry){d.practice.wrong=d.practice.wrong.filter(w=>w.q!==q&&w.q.html!==q.html);} // 재도전에서 맞히면 목록에서 제거
  save(d);
  if(!ok&&!s.meta.retry&&!q._requeued){const again=Object.assign({},q,{_requeued:true});s.requeue.push(again);}
  // 피드백
  const ansText=q.kind==='num'?`${Nd(Math.round(q.ans*100)/100)}${q.unit||''}`:q.kind==='ox'?(q.ans?'O':'X'):q.choices[q.ans];
  document.getElementById('pfb').innerHTML=`<div class="sol ${ok?'ok':''}" style="font-size:14px"><span class="${ok?'cr':'wr'}" style="font-size:16px">${ok?'○ 정답':'✕ 오답'}</span> · 정답 <b>${ansText}</b>${ok?'':` <span style="color:var(--sub)">(내 답 ${shown})</span>`}<br>${q.why}</div>`;
  document.getElementById('pq').className='card '+(ok?'flash-ok':'flash-no');
  app().querySelectorAll('#pq input,#pq button').forEach(b=>{b.disabled=true;});
  if(q.kind==='ox')app().querySelectorAll('[data-ox]').forEach(b=>{if((b.dataset.ox==='1')===q.ans)b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});
  if(q.kind==='choice')app().querySelectorAll('[data-ch]').forEach(b=>{if(+b.dataset.ch===q.ans)b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});
  document.getElementById('pact').innerHTML=`<button class="btn primary center" id="pnext">${s.i+1<s.qs.length||s.requeue.length?'다음 ›':'결과 보기'}</button>`;
  const next=()=>{s._done=false;s.i++;if(s.i>=s.qs.length){if(s.requeue.length){s.qs=s.qs.concat(s.requeue);s.requeue=[];toast('틀린 문제 다시 나와요');}else{finishPractice();return;}}renderPractice();};
  document.getElementById('pnext').onclick=next; document.getElementById('pnext').focus();
  document.onkeydown=e=>{if(e.key==='Enter')next();};
}
function finishPractice(early){
  const s=S.ps;clearInterval(s.timer);document.onkeydown=null;
  if(!s.res.length){go(screenPractice);return;}
  const sec=Math.round((Date.now()-s.start)/10)/100;
  const by={};s.res.forEach(r=>{const b=by[r.q.topic]=by[r.q.topic]||{n:0,w:0};b.n++;if(!r.ok)b.w++;});
  const n=s.res.length,w=s.res.filter(r=>!r.ok).length;
  app().innerHTML=`
    <button class="back" id="bk">‹ 집중 연습</button>
    <h1>연습 결과</h1>${early?'<div class="sub">⏸ 중간 종료 · 푼 문제만 집계</div>':''}
    <div class="grid3">
      <div class="stat y"><div class="n">${n-w} / ${n}</div><div class="l">정답</div></div>
      <div class="stat b"><div class="n">${fmt(sec*1000)}</div><div class="l">걸린 시간</div></div>
      <div class="stat p"><div class="n">${Nd((sec/n).toFixed(1))}<span style="font-size:13px">초</span></div><div class="l">문제당</div></div>
    </div>

    ${w?`<div class="sec-title">틀린 문제 (${w})</div>${s.res.filter(r=>!r.ok).map(r=>`<div class="wrong" style="display:block"><div class="exp" style="font-size:14px">${r.q.html}</div><div class="sol">내 답 <span class="wr">${r.your}</span> · 정답 <b>${r.q.kind==='num'?Nd(Math.round(r.q.ans*100)/100)+(r.q.unit||''):r.q.kind==='ox'?(r.q.ans?'O':'X'):r.q.choices[r.q.ans]}</b><br>${r.q.why}</div></div>`).join('')}`:`<div class="muted" style="margin-top:16px">✅ 전부 정답!</div>`}
    <div style="height:12px"></div>
    <button class="btn primary big center" id="again">같은 설정으로 한 세트 더 🔁</button>
    <button class="btn center" id="home">홈으로</button>
  `;
  document.getElementById('bk').onclick=()=>go(screenPractice);
  document.getElementById('home').onclick=()=>go(screenHome);
  document.getElementById('again').onclick=()=>{go(screenPractice);document.getElementById('start').click();};
}
/* 연습장 (펜슬/손가락 자유 필기, 저장 안 함) */
function setupPad(){
  const c=document.getElementById('pad'); if(!c)return;
  const dpr=window.devicePixelRatio||1; const w=c.clientWidth||300, h=180;
  c.width=w*dpr; c.height=h*dpr; c.style.height=h+'px';
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#fff';
  let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{if(S.pr.pen&&e.pointerType==='touch')return;drawing=true;c.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);e.preventDefault();};
  c.onpointermove=e=>{if(!drawing)return;const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();e.preventDefault();};
  c.onpointerup=c.onpointercancel=()=>{drawing=false;};
  document.getElementById('clr').onclick=()=>ctx.clearRect(0,0,w,h);
  document.getElementById('pen').onclick=()=>{S.pr.pen=!S.pr.pen;document.getElementById('pen').classList.toggle('on',S.pr.pen);toast(S.pr.pen?'펜슬만 입력 (손가락은 스크롤)':'손가락도 입력');};
}

/* ================= 개념 학습 ================= */

function csave(id,rec){const d=db();d.concepts=d.concepts||{};d.concepts[id]=rec;save(d);}

function screenGroup(gid){

function screenConcept(id){

function renderExample(ex){

    h=`<div class="qtag" style="margin-bottom:8px">다음 빈칸을 채우시오 (${ex.rows.reduce((s,r)=>s+r.cells.filter(c=>!c.show).length,0)}칸)</div><div class="exwrap"><table class="ctab"><tr>${ex.head.map(x=>`<th>${x}</th>`).join('')}</tr>
      ${ex.rows.map((r,ri)=>`<tr><th class="rl">${r.label}</th>${r.cells.map((cell,ci)=>`<td>${cell.show?(cell.text?cell.v:Nd(cell.v)):`<input inputmode="decimal" data-r="${ri}" data-c="${ci}" placeholder="?">`}</td>`).join('')}</tr>`).join('')}

  }

const near=(u,v)=>{if(u==null||u==='')return false;const x=parseFloat(String(u).replace(/,/g,''));if(isNaN(x))return false;return Math.abs(x-v)<=Math.max(0.011,Math.abs(v)*0.006);};
function gradeExample(id){
  const ex=S.ex, box=document.getElementById('exbox'); let n=0,w=0;
  if(ex.type==='table'){
    let solh='';
    box.querySelectorAll('input').forEach(inp=>{
      const cell=ex.rows[+inp.dataset.r].cells[+inp.dataset.c], ok=near(inp.value,cell.v);
      n++; if(!ok)w++;
      inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no'); inp.readOnly=true;
      solh+=`<div><span class="${ok?'cr':'wr'}">${ok?'○':'✕'}</span> ${ex.head[+inp.dataset.c+1]} · ${ex.rows[+inp.dataset.r].label}: <b>${Nd(cell.v)}</b>${ok?'':` (내 답 ${inp.value||'빈칸'})`}<br><span style="padding-left:18px">${cell.sol||''}</span></div>`;
    });
    document.getElementById('exsol').innerHTML=`<div class="sol">${solh}</div>`;
  }else if(ex.type==='ox'){
    box.querySelectorAll('.qitem').forEach((q,i)=>{
      const it=ex.items[i], sel=q.querySelector('.oxb .sel'); const u=sel?sel.dataset.ox==='1':null; const ok=u===it.ans;
      n++; if(!ok)w++;
      q.querySelectorAll('.oxb button').forEach(b=>{b.disabled=true;const isAns=(b.dataset.ox==='1')===it.ans;if(isAns)b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');});
      const s=q.querySelector('.sol');s.style.display='';s.innerHTML=`<span class="${ok?'cr':'wr'}">${ok?'○ 정답':u===null?'✕ 미선택':'✕ 오답'}</span> · 정답 <b>${it.ans?'O':'X'}</b><br>${it.why}`;
    });
  }else{
    box.querySelectorAll('.qitem').forEach((q,i)=>{
      const it=ex.items[i], inp=q.querySelector('input'), ok=near(inp.value,it.ans);
      n++; if(!ok)w++; inp.classList.add(ok?'ok':'no'); inp.readOnly=true;
      const s=q.querySelector('.sol');s.style.display='';s.innerHTML=`<span class="${ok?'cr':'wr'}">${ok?'○ 정답':'✕ 오답'}</span> · 정답 <b>${Nd(it.ans)}${it.unit||''}</b><br>${it.why}`;
    });
  }
  const r=cdb(id); r.n+=n; r.w+=w; csave(id,r);
  document.getElementById('grade').disabled=true;
  const sc=document.createElement('div');sc.className='exsc';sc.innerHTML=`<span class="${w?'':'gA'}" style="font-size:18px">${n-w} / ${n}</span><span style="color:var(--sub)">${w?'틀린 칸의 풀이를 확인한 뒤 "새 숫자로" 다시 풀어보세요':'전부 정답! 새 숫자로 한 번 더'}</span>`;
  box.appendChild(sc);
  if(w===0)toast('🎉 전부 정답!');
}

/* ================= 세션 진행 ================= */
function startSession(problems,meta){
  S.sess={problems,meta,i:0,wrong:[],correct:0,start:Date.now(),timer:null};
  renderSession();
  S.sess.timer=setInterval(updTimer,200);
}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updTimer(){const e=document.getElementById('timer');if(e)e.textContent=fmt(Date.now()-S.sess.start);}
function renderSession(){
  const s=S.sess, p=s.problems[s.i], t=s.problems.length;
  s._lock=false; // 새 문제 → 제출 잠금 해제
  const pct=Math.round(s.i/t*100);
  const qhtml=`<div class="qtag">${p._type}</div>`+ (p.kind==='frac'
      ? `<div class="cmp">${frac(p.left.n,p.left.d)}<span class="qmark">?</span>${frac(p.right.n,p.right.d)}</div>`
      : `<div class="cmp"><span class="mul">${dec(p.left.a)} × ${dec(p.left.b)}</span><span class="qmark">?</span><span class="mul">${dec(p.right.c)} × ${dec(p.right.d)}</span></div>`);
  app().innerHTML=`
    <div class="prog"><span>${s.i+1} / ${t}</span><span class="timer" id="timer">00:00</span>
      <span><button class="back" id="quit" style="padding:0;font-size:14px">종료</button></span></div>
    <div class="pbar"><div style="width:${pct}%"></div></div>
    <div class="qbox" id="qbox">${qhtml}</div>
    <div class="cmpbtns"><button class="cmpbtn" data-c="&lt;">&lt;</button><button class="cmpbtn" data-c="&gt;">&gt;</button></div>
  `;
  document.getElementById('quit').onclick=()=>finishSession(true);
  app().querySelectorAll('.cmpbtn').forEach(b=>b.onpointerdown=ev=>{ev.preventDefault();submit(b.dataset.c);});
  // 키보드: ← 또는 , = "<",  → 또는 . = ">"
  document.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key===','||e.key==='<')submit('<');else if(e.key==='ArrowRight'||e.key==='.'||e.key==='>')submit('>');};
}
function frac(n,d){return `<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;}
function submit(val){
  const s=S.sess; if(!s||s._lock)return; s._lock=true; // 중복 제출 방지
  const p=s.problems[s.i];
  const ok = val===p.answer;
  if(ok)s.correct++;
  else s.wrong.push({q:cmpText(p), your:val, correct:p.answer, p}); // p: 재도전용 원본 문제
  if(p._id==='fraccmp'&&!s.meta.retry)recordFrac(p,ok,val); // 분수비교 통계 (재도전 제외)
  const box=document.getElementById('qbox');
  box.className='qbox '+(ok?'flash-ok':'flash-no');
  // 짧은 피드백 후 다음
  const delay=ok?150:650;
  if(!ok){ // 오답이면 정답 잠깐 표시
    const info=document.createElement('div');info.style.cssText='color:var(--red);font-weight:700;margin-top:10px;font-size:15px';
    info.textContent='정답: '+p.answer;
    box.appendChild(info);
  }
  setTimeout(()=>{
    s.i++;
    if(s.i>=s.problems.length)finishSession();
    else renderSession();
  },delay);
}
function cmpText(p){return p.kind==='frac'?`${p.left.n}/${p.left.d} ? ${p.right.n}/${p.right.d}`:`${dec(p.left.a)}×${dec(p.left.b)} ? ${dec(p.right.c)}×${dec(p.right.d)}`;}

/* ================= 분수비교 풀이법 분석 ================= */
// 각 풀이법의 "쉬움 점수(ease)": 그 방법으로 비교했을 때 두 값이 몇 % 벌어져 보이는지.
// 많이 벌어질수록 어림으로 판단하기 쉬움 → 가장 큰 쪽을 추천.
const FM={
  dir:{k:'dir',name:'방향 즉시판단',short:'방향'},
  lr:{k:'lr',name:'좌우 증감률 비교',short:'좌우'},
  diff:{k:'diff',name:'차이 분수 (아바타)',short:'아바타'},
  ud:{k:'ud',name:'상하 비교 (값 어림)',short:'상하'},
  one:{k:'one',name:'1에서 빠지는 양 비교',short:'1−x'},
};
const BUCKETS=['<1%','1~3%','3~5%','5~10%','10%+'];
function P(x){const v=x*100;const s=Math.abs(v)>=100?v.toFixed(0):v.toFixed(1);return dec(s.replace(/\.0$/,''))+'%';}
const sgn=r=>(r>=0?'+':'−')+P(Math.abs(r));
function fracGap(a,b,c,d){const v1=a/b,v2=c/d;return Math.abs(v1-v2)/Math.min(v1,v2)*100;}
function gapBucket(g){return g<1?'<1%':g<3?'1~3%':g<5?'3~5%':g<10?'5~10%':'10%+';}
function fracMethods(p){
  const a=p.left.n,b=p.left.d,c=p.right.n,d=p.right.d;
  const v1=a/b,v2=c/d, rightBig=v2>v1, win=rightBig?'오른쪽':'왼쪽';
  const gap=fracGap(a,b,c,d);
  const out=[];
  if((c>=a&&d<=b)||(c<=a&&d>=b)){
    const ar=(x,y)=>x===y?'같음':x<y?'↑':'↓';
    out.push({...FM.dir,ease:999,text:`분자 ${a}→${c} (${ar(a,c)}) · 분모 ${b}→${d} (${ar(b,d)}) → 계산 없이 <b>${win}</b>이 큼`});
  }else{
    // 좌우: 분자 변화율 vs 분모 변화율
    const rN=(c-a)/a, rD=(d-b)/b; let e=Math.abs(rN-rD)*100;
    if(Math.max(Math.abs(rN),Math.abs(rD))>1)e*=0.5; // 100% 넘는 변화율은 어림이 어려움
    out.push({...FM.lr,ease:e,text:`분자 ${a}→${c} (${sgn(rN)}) · 분모 ${b}→${d} (${sgn(rD)}) → ${rN>rD?(rN>=0?'분자가 더 많이 늘어':'분자가 덜 줄어'):(rD>=0?'분모가 더 많이 늘어':'분모가 덜 줄어')} <b>${win}</b>이 큼`});
    // 아바타: 분자 큰 쪽에서 작은 쪽을 빼서 차이분수 vs 작은 쪽 분수
    const [p1,q1,p2,q2]=c>a?[c,d,a,b]:[a,b,c,d]; // p1>p2, q1>q2
    const df=(p1-p2)/(q1-q2), base=p2/q2, rel=Math.abs(df/base-1)*100;
    const small=(p1-p2)<100&&(q1-q2)<100;
    out.push({...FM.diff,ease:rel*(small?1:0.6),text:`차이 분수 ${p1-p2}/${q1-q2} ≈ ${P(df)} vs ${p2}/${q2} ≈ ${P(base)} → 차이분수가 ${df>base?'더 커서 분자 큰 쪽':'더 작아서 분자 작은 쪽'}인 <b>${win}</b>이 큼`});
  }
  // 상하: 각 분수 값을 어림
  const BM=[[.25,'1/4'],[1/3,'1/3'],[.5,'1/2'],[2/3,'2/3'],[.75,'3/4'],[1,'1'],[1.5,'1.5'],[2,'2']];
  const bm=BM.find(x=>(v1-x[0])*(v2-x[0])<0);
  out.push({...FM.ud,ease:gap*(bm?1.8:1),text:`${a}/${b} ≈ ${P(v1)} · ${c}/${d} ≈ ${P(v2)}${bm?` (기준 ${bm[1]}을 사이에 두고 갈림)`:''} → <b>${win}</b>이 큼`});
  // 1−x 또는 x−1
  if(v1<1&&v2<1){
    const m1=(b-a)/b,m2=(d-c)/d, rel=Math.abs(m1-m2)/Math.min(m1,m2)*100;
    out.push({...FM.one,ease:rel*(Math.min(v1,v2)<.6?.5:1),text:`1에서 빠지는 양: 왼쪽 ${b-a}/${b} ≈ ${P(m1)} · 오른쪽 ${d-c}/${d} ≈ ${P(m2)} → 덜 빠지는 <b>${win}</b>이 큼`});
  }else if(v1>1&&v2>1){
    const m1=v1-1,m2=v2-1, rel=Math.abs(m1-m2)/Math.min(m1,m2)*100;
    out.push({...FM.one,name:'분모→분자 증가율 비교',ease:rel*(Math.max(v1,v2)>2?.5:1),text:`분모→분자 증가율: 왼쪽 ${b}→${a} (${sgn(m1)}) · 오른쪽 ${d}→${c} (${sgn(m2)}) → 더 많이 늘어난 <b>${win}</b>이 큼`});
  }
  out.sort((x,y)=>y.ease-x.ease);
  return {methods:out,best:out[0],gap,bucket:gapBucket(gap),win};
}
function adviceHTML(p){
  const an=fracMethods(p);
  const stars=e=>e>=999?'계산 불필요':e>=15?'쉬움':e>=5?'보통':'어려움';
  return `<div class="adv">
    <div class="gap">두 값 차이 <b>${dec(an.gap.toFixed(1))}%</b> (${an.bucket})</div>
    ${an.methods.map((m,i)=>`<div class="m ${i===0?'best':''}">${i===0?'<span class="tag">추천</span>':''}<b>${m.name}</b> <span class="ez">· ${stars(m.ease)}</span><br>${m.text}</div>`).join('')}
    ${an.best.ease<5?`<div class="m" style="border-left-color:var(--red)"><b>⚠ 어림으로는 어려운 문제</b><br>이 정도 차이는 모든 방법이 애매해요. 시간을 쓰더라도 통분·곱셈 비교(${p.left.n}×${p.right.d} vs ${p.right.n}×${p.left.d})로 확인하는 게 안전합니다.</div>`:''}
  </div>`;
}
// 통계 누적: 차이 구간별 · 추천 풀이법별 시도/오답 수, 최근 오답 목록
function recordFrac(p,ok,val){
  const d=db(); const f=d.frac;
  const an=fracMethods(p);
  const bump=(o,k)=>{o[k]=o[k]||{n:0,w:0};o[k].n++;if(!ok)o[k].w++;};
  bump(f.bucket,an.bucket); bump(f.method,an.best.k);
  if(!ok){f.wrong.push({a:p.left.n,b:p.left.d,c:p.right.n,d:p.right.d,your:val,ts:Date.now()});if(f.wrong.length>100)f.wrong=f.wrong.slice(-100);}
  save(d);
}

/* 오답 패널티: 유형별로 틀린 문제 1개당 더해지는 초. 일단 분수비교만. */
const PENALTY={fraccmp:15};
const penaltyFor=p=>PENALTY[p._id]||0;

function finishSession(early){
  const s=S.sess;clearInterval(s.timer);document.onkeydown=null;
  const answered=s.i; // 실제로 푼 문제 수
  if(early && answered===0){ go(s.meta.backTo); return; } // 하나도 안 풀고 종료 → 그냥 나감
  const raw=(Date.now()-s.start)/1000;
  const penalty=s.wrong.reduce((sum,w)=>sum+penaltyFor(w.p),0); // 틀린 문제 패널티 합
  const elapsed=raw+penalty; // 패널티 포함 시간으로 채점·기록
  const subset=s.problems.slice(0,answered); // 푼 문제만 채점 기준
  const g=gradeOf(subset,elapsed);
  const total=answered;
  const rec={date:today(),ts:Date.now(),sec:Math.round(elapsed*10)/10,rawSec:Math.round(raw*10)/10,penalty,total,correct:s.correct,grade:g,partial:!!early};
  const tid=s.meta.typeId;
  const prevBest=bestPerProblem(tid);
  let isPB=false;
  if(!early && !s.meta.retry){ // 전체 완주(재도전 제외)만 정식 기록·최고기록으로 저장
    saveSession(tid,rec);
    const nowPer=elapsed/total;
    isPB=(s.correct===total)&&(prevBest===null||nowPer<prevBest);
  }
  screenResult(rec,g,isPB,prevBest,s.wrong,s.meta,early);
}
// 틀린 문제만 모아 다시 풀기 (기록엔 저장하지 않음)
function startRetry(wrong,meta){
  const probs=wrong.map(w=>w.p);
  startSession(probs,{title:'틀린 문제 다시 풀기',backTo:meta.backTo,typeId:meta.typeId,retry:true,round:(meta.round||0)+1});
}

function screenResult(rec,g,isPB,prevBest,wrong,meta,early){
  const acc=Math.round(rec.correct/rec.total*100);
  const per=dec((rec.sec/rec.total).toFixed(1));
  const hasFrac=S.sess&&S.sess.problems.some(p=>p._id==='fraccmp');
  app().innerHTML=`
    <button class="back" id="bk">‹ 홈</button>
    <h1>${meta.title}</h1>
    ${early?`<div style="text-align:center;margin:-4px 0 10px"><span class="chip" style="background:var(--card2)">⏸ 중단 · 푼 ${rec.total}문제만 채점 (기록엔 미저장)</span></div>`:''}
    ${meta.retry?`<div style="text-align:center;margin:-4px 0 10px"><span class="chip" style="background:var(--card2)">🔁 틀린 문제 재도전 ${meta.round}회차 · 기록엔 미저장</span></div>`:''}
    <div class="grade g${g}">${g}</div>
    ${isPB?`<div style="text-align:center;margin-bottom:12px"><span class="pb-tag">🎉 신기록! ${prevBest?dec(prevBest.toFixed(1))+'→':''}${per}초/문제</span></div>`:''}
    <div class="grid3">
      <div class="stat"><div class="n">${fmt(rec.sec*1000)}</div><div class="l">${rec.penalty?`걸린 시간 (실제 ${fmt(rec.rawSec*1000)})`:'걸린 시간'}</div></div>
      <div class="stat"><div class="n">${acc}%</div><div class="l">정답률 (${rec.correct}/${rec.total})</div></div>
      <div class="stat"><div class="n">${per}<span style="font-size:13px">초</span></div><div class="l">문제당</div></div>
    </div>
    ${rec.penalty?`<div class="muted" style="color:var(--red);margin-top:8px">⏱ 오답 패널티 +${rec.penalty}초 (분수 비교 틀린 ${wrong.filter(w=>penaltyFor(w.p)).length}문제 × ${PENALTY.fraccmp}초)</div>`:''}
    ${wrong.length?`
    <div class="card" id="retrycard" style="margin-top:12px;border:2px solid var(--yellow)">
      <div style="font-weight:700;font-size:16px;margin-bottom:10px">틀린 문제 ${wrong.length}개만 다시 풀어볼까요?</div>
      <div class="row" style="margin-bottom:0">
        <button class="btn primary center" id="retry">네, 틀린 것만 🔁</button>
        <button class="btn center" id="noretry">아니요</button>
      </div>
    </div>`:''}
    ${wrong.length?`<div class="sec-title">틀린 문제 (${wrong.length})</div>${wrong.map(w=>`
      <div class="wrong"><span class="q">${w.q}</span><span><span class="yr">내 답 ${w.your}</span> → <span class="cr">${w.correct}</span></span>${w.p._id==='fraccmp'?adviceHTML(w.p):''}</div>`).join('')}`:`<div class="muted" style="margin-top:16px">✅ 전부 정답!${meta.retry?' 틀린 문제를 모두 잡았어요 🎉':''}</div>`}
    <div style="height:12px"></div>
    <button class="btn ${wrong.length?'':'primary '}big center" id="again">${meta.retry?'새 세트 풀기 🔄':'다시 풀기 🔄'}</button>
    ${hasFrac?`<button class="btn big center" id="fa">분수 비교 오답 분석 🔍</button>`:''}
    <button class="btn big center" id="rec">이 유형 기록 보기 📈</button>
    <button class="btn center" id="home">홈으로</button>
  `;
  document.getElementById('bk').onclick=()=>go(screenHome);
  document.getElementById('home').onclick=()=>go(screenHome);
  document.getElementById('again').onclick=()=>go(meta.backTo);
  if(hasFrac)document.getElementById('fa').onclick=()=>go(screenFracAnalysis);
  if(wrong.length){
    document.getElementById('retry').onclick=()=>go(()=>startRetry(wrong,meta));
    document.getElementById('noretry').onclick=()=>{document.getElementById('retrycard').remove();};
  }
  document.getElementById('rec').onclick=()=>go(()=>screenRecords(meta.typeId));
  if(isPB)toast('🎉 신기록 달성!');
}

/* ================= 기록실 ================= */
function screenRecords(focusId){
  const d=db();
  const ids=Object.keys(d.records).filter(k=>d.records[k].length&&(TYPE(k)||k.startsWith('complex_'))); // 삭제된 유형 기록은 숨김
  const label=k=>k.startsWith('complex_')?'복합 훈련':(TYPE(k)?.name||k);
  if(!ids.length){
    app().innerHTML=`<button class="back" id="bk">‹ 홈</button><h1>기록실</h1><div class="muted" style="margin-top:40px">아직 기록이 없어요.<br>스킬 드릴을 한 번 풀어보세요!</div>`;
    document.getElementById('bk').onclick=()=>go(screenHome);return;
  }
  const sel=focusId&&d.records[focusId]?focusId:ids[0];
  const h=d.records[sel];
  const per=h.map(r=>r.sec/r.total);
  const best=Math.min(...per), avg=per.reduce((a,b)=>a+b,0)/per.length;
  const gd={S:0,A:0,B:0,C:0,D:0};h.forEach(r=>gd[r.grade]++);
  app().innerHTML=`
    <button class="back" id="bk">‹ 홈</button>
    <h1>기록실</h1>
    <div style="overflow-x:auto;white-space:nowrap;margin-bottom:8px">${ids.map(k=>`<span class="chip ${k===sel?'on':''}" data-id="${k}">${label(k)}</span>`).join('')}</div>
    <div class="grid3">
      <div class="stat"><div class="n">${dec(best.toFixed(1))}<span style="font-size:12px">초</span></div><div class="l">최고 (문제당)</div></div>
      <div class="stat"><div class="n">${dec(avg.toFixed(1))}<span style="font-size:12px">초</span></div><div class="l">평균</div></div>
      <div class="stat"><div class="n">${h.length}</div><div class="l">세션 수</div></div>
    </div>
    <div class="sec-title">성장 그래프 (문제당 초 · 최근 ${Math.min(h.length,20)})</div>
    <div class="card">${chart(per.slice(-20))}</div>
    <div class="sec-title">등급 분포</div>
    <div class="card">${['S','A','B','C','D'].map(g=>{const w=Math.round(gd[g]/h.length*100);return `
      <div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span class="g${g}" style="font-weight:800;width:20px">${g}</span>
      <div style="flex:1;background:var(--card2);border-radius:6px;height:16px;overflow:hidden"><div style="width:${w}%;height:100%;background:var(--yellow)"></div></div>
      <span style="width:36px;text-align:right;color:var(--sub);font-size:13px">${gd[g]}</span></div>`;}).join('')}</div>
    ${sel==='fraccmp'||sel.startsWith('complex_')?`<button class="btn big center" id="fa" style="margin-top:6px">분수 비교 오답 분석 🔍</button>`:''}
    <div class="sec-title">데이터</div>
    <div class="row"><button class="btn center" id="exp">기록 내보내기 💾</button><button class="btn center" id="imp">불러오기 📂</button></div>
    <button class="btn center" id="clr" style="margin-top:10px;color:var(--red)">이 유형 기록 삭제</button>
  `;
  document.getElementById('bk').onclick=()=>go(screenHome);
  const fa=document.getElementById('fa'); if(fa)fa.onclick=()=>go(screenFracAnalysis);
  app().querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(()=>screenRecords(c.dataset.id)));
  document.getElementById('exp').onclick=exportData;
  document.getElementById('imp').onclick=importData;
  document.getElementById('clr').onclick=()=>{if(confirm(label(sel)+' 기록을 삭제할까요?')){const dd=db();delete dd.records[sel];save(dd);go(()=>screenRecords());}};
}
/* ================= 분수비교 오답 분석 화면 ================= */
function screenFracAnalysis(){
  const f=db().frac;
  const tot=Object.values(f.bucket).reduce((s,x)=>s+x.n,0), totW=Object.values(f.bucket).reduce((s,x)=>s+x.w,0);
  const back=`<button class="back" id="bk">‹ 뒤로</button><h1>분수 비교 분석</h1>`;
  if(!tot){
    app().innerHTML=back+`<div class="muted" style="margin-top:40px">아직 분수 비교 기록이 없어요.<br>스킬 드릴 → 분수 비교를 풀면 쌓입니다.</div>`;
    document.getElementById('bk').onclick=()=>go(()=>screenRecords('fraccmp'));return;
  }
  const pct=(w,n)=>n?Math.round(w/n*100):0;
  const bar=(lb,w,n)=>`<div class="bar"><span class="lb">${lb}</span><div class="tr"><div style="width:${pct(w,n)}%"></div></div><span class="nn">${w}/${n} · ${pct(w,n)}%</span></div>`;
  const brows=BUCKETS.map(k=>({k,...(f.bucket[k]||{n:0,w:0})})).filter(r=>r.n);
  const mrows=Object.keys(FM).map(k=>({k,name:FM[k].name,...(f.method[k]||{n:0,w:0})})).filter(r=>r.n);
  // 인사이트: 시도 3회 이상인 구간/풀이법 중 오답률이 가장 높은 것
  const avg=totW/tot; // 전체 오답률보다 높은 구간/풀이법만 약점으로 지적 (시도 3회 이상)
  const worst=arr=>arr.filter(r=>r.n>=3&&r.w>0&&r.w/r.n>avg).sort((x,y)=>y.w/y.n-x.w/x.n)[0];
  const wb=worst(brows), wm=worst(mrows);
  const insights=[];
  if(wb)insights.push(`두 값 차이가 <b>${wb.k}</b>인 문제를 가장 많이 틀려요 (${wb.n}문제 중 ${wb.w}개, ${pct(wb.w,wb.n)}%).`);
  if(wm)insights.push(`<b>${wm.name}</b>이 가장 쉬운 문제에서 오답률이 높아요 (${pct(wm.w,wm.n)}%). 이 방법을 집중 연습해 보세요.`);
  if(!insights.length)insights.push('데이터가 더 쌓이면 약점을 짚어드려요. (구간별 3문제 이상)');
  const recent=f.wrong.slice(-15).reverse();
  app().innerHTML=back+`
    <div class="sub">차이 크기별·풀이법별로 어디서 틀리는지</div>
    <div class="grid3">
      <div class="stat"><div class="n">${tot}</div><div class="l">푼 문제</div></div>
      <div class="stat"><div class="n">${totW}</div><div class="l">오답</div></div>
      <div class="stat"><div class="n">${pct(totW,tot)}%</div><div class="l">오답률</div></div>
    </div>
    <div class="card" style="border:2px solid var(--yellow);line-height:1.6;font-size:14px">💡 ${insights.join('<br>')}</div>
    <div class="sec-title">두 값 차이별 오답률</div>
    <div class="card">${brows.map(r=>bar(r.k,r.w,r.n)).join('')}
      <div class="hint">차이 = |왼쪽값 − 오른쪽값| ÷ 작은 값. 1% 미만은 실전에서도 계산이 필요한 구간이에요.</div></div>
    <div class="sec-title">추천 풀이법별 오답률</div>
    <div class="card">${mrows.map(r=>bar(FM[r.k].short,r.w,r.n)).join('')}
      <div class="hint">각 문제마다 "가장 크게 벌어져 보이는" 풀이법을 추천법으로 분류했어요. 어떤 방법이 필요한 문제에서 자주 틀리는지 볼 수 있습니다.</div></div>
    <div class="sec-title">풀이법 요약</div>
    <div class="card" style="font-size:13px;line-height:1.6;color:var(--sub)">
      <b style="color:var(--txt)">방향 즉시판단</b> 분자↑ 분모↓면 계산 없이 큼.<br>
      <b style="color:var(--txt)">좌우 증감률</b> 분자 변화율 vs 분모 변화율. 분자가 더 많이 늘면 오른쪽이 큼.<br>
      <b style="color:var(--txt)">차이 분수(아바타)</b> 큰 쪽에서 작은 쪽을 뺀 분수와 작은 쪽 분수를 비교. 분모가 비슷할 때 차이가 크게 보임.<br>
      <b style="color:var(--txt)">상하 비교</b> 각 분수 값을 % 로 어림. 1/2·2/3·1 같은 기준을 사이에 두면 즉시 판단.<br>
      <b style="color:var(--txt)">1에서 빠지는 양</b> 값이 1에 가까우면 (분모−분자)/분모 끼리 비교. 덜 빠지는 쪽이 큼. 1보다 크면 분모→분자 증가율로.
    </div>
    ${recent.length?`<div class="sec-title">최근 틀린 문제 (${recent.length}) · 추천 풀이</div>${recent.map(w=>{
      const p={left:{n:w.a,d:w.b},right:{n:w.c,d:w.d}};const ans=(w.a*w.d>w.c*w.b)?'>':'<';
      return `<div class="wrong"><span class="q">${w.a}/${w.b} ? ${w.c}/${w.d}</span><span><span class="yr">내 답 ${w.your}</span> → <span class="cr">${ans}</span></span>${adviceHTML(p)}</div>`;}).join('')}`:''}
    <button class="btn center" id="clr" style="margin-top:10px;color:var(--red)">분석 데이터 초기화</button>
  `;
  document.getElementById('bk').onclick=()=>go(()=>screenRecords('fraccmp'));
  document.getElementById('clr').onclick=()=>{if(confirm('분수 비교 분석 데이터를 모두 지울까요?')){const dd=db();dd.frac={bucket:{},method:{},wrong:[]};save(dd);go(screenFracAnalysis);}};
}
function chart(vals){
  if(vals.length<2)return `<div class="muted">데이터가 2개 이상 쌓이면 그래프가 표시됩니다.</div>`;
  const w=460,h=110,pad=8;const mn=Math.min(...vals),mx=Math.max(...vals);const rng=(mx-mn)||1;
  const x=i=>pad+i*(w-2*pad)/(vals.length-1);
  const y=v=>pad+(v-mn)/rng*(h-2*pad);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="#FFD400" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#FFD400"/>`).join('')}
  </svg><div class="muted" style="padding:0;margin-top:4px">아래로 내려갈수록 빨라진 것 (최고 ${dec(mn.toFixed(1))}초 · 최저 ${dec(mx.toFixed(1))}초)</div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(load())],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='암산연습_백업.json';a.click();toast('백업 파일을 저장했어요');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const data=JSON.parse(rd.result);save(data);toast('기록을 불러왔어요');go(()=>screenRecords());}catch(err){alert('파일을 읽을 수 없어요')}};
    rd.readAsText(f);};
  inp.click();
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

/* ================= 시작 ================= */
screenHome();
</script>
</body>
